name: mtg-rag

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: mtg
      POSTGRES_USER: mtg
      POSTGRES_PASSWORD: mtg
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mtg -d mtg"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  api:
    build:
      context: ./backend
    environment:
      MTG_RAG_DATABASE_URL: postgresql+asyncpg://mtg:mtg@db:5432/mtg
      MTG_RAG_FRONTEND_ORIGIN: ${MTG_RAG_FRONTEND_ORIGIN:-http://localhost:5173}
      MTG_RAG_OPENAI_API_KEY: ${MTG_RAG_OPENAI_API_KEY:-}
      MTG_RAG_GCP_PROJECT_ID: ${MTG_RAG_GCP_PROJECT_ID:-}
      MTG_RAG_GCS_SNAPSHOT_BUCKET: ${MTG_RAG_GCS_SNAPSHOT_BUCKET:-}
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-}
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  ingestion:
    build:
      context: ./backend
    command: ["mtg-rag-ingest"]
    profiles: ["jobs"]
    environment:
      MTG_RAG_DATABASE_URL: postgresql+asyncpg://mtg:mtg@db:5432/mtg
      MTG_RAG_OPENAI_API_KEY: ${MTG_RAG_OPENAI_API_KEY:-}
      MTG_RAG_GCP_PROJECT_ID: ${MTG_RAG_GCP_PROJECT_ID:-}
      MTG_RAG_GCS_SNAPSHOT_BUCKET: ${MTG_RAG_GCS_SNAPSHOT_BUCKET:-}
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres-data:

